name: EKS AWS CE – Destroy

# ─── Descripción del workflow ──────────────────────────────────────────────────
# Destruye el escenario EKS + F5 XC CE en orden inverso al deploy.
# El state de Terraform Cloud contiene todos los valores reales — las variables
# de red se pasan con placeholders ya que Terraform las ignora durante el destroy.
#
# Orden de destrucción:
#   Stage 0 – xc-lb:        Elimina Service Discovery + Origin Pool + HTTP LB
#   Stage 1 – hipster-shop:  Elimina manifiestos Kubernetes
#   Stage 2a – eks:          Elimina cluster EKS (paralelo con 2b)
#   Stage 2b – ce:           Elimina Customer Edge F5 XC (paralelo con 2a)
#   Stage 3 – vpc:           Elimina VPC, subnets, NAT GW, IGW
#
# ─── Workspaces TFC (mismos que en deploy) ────────────────────────────────────
#   eks-aws-ce-lb    → Stack XC LB
#   eks-aws-ce       → Stack EKS
#   eks-aws-ce-site  → Stack CE
#   eks-aws-ce-vpc   → Stack VPC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Stage 0 — Destruir XC LB (Service Discovery + Origin Pool + HTTP LB)
  # ────────────────────────────────────────────────────────────────────────────
  xc-lb-destroy:
    name: "Stage 0 · Destroy XC LB"
    runs-on: ubuntu-latest
    env:
      VES_P12_PASSWORD: ${{ secrets.XC_P12_PASSWORD }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ secrets.TFC_ORG }}
      TF_WORKSPACE: eks-aws-ce-lb
    defaults:
      run:
        working-directory: eks-aws-ce/xc-lb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Check if TFC workspace exists
        id: check_ws
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          TFC_ORG:   ${{ secrets.TFC_ORG }}
        run: |
          WS_NAME="eks-aws-ce-lb"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            "https://app.terraform.io/api/v2/organizations/${TFC_ORG}/workspaces/${WS_NAME}")
          if [ "$STATUS" = "200" ]; then
            echo "ws_exists=true" >> "$GITHUB_OUTPUT"
            echo "Workspace '${WS_NAME}' encontrado."
          else
            echo "ws_exists=false" >> "$GITHUB_OUTPUT"
            echo "Workspace '${WS_NAME}' no existe (HTTP $STATUS) — skip destroy."
          fi

      - name: Write F5 XC API credentials
        if: steps.check_ws.outputs.ws_exists == 'true'
        env:
          XC_API_P12_FILE: ${{ secrets.XC_API_P12_FILE }}
        run: |
          printf '%s' "${XC_API_P12_FILE}" | tr -d '\n\r ' | base64 -d > api.p12
          chmod 600 api.p12

      - name: Terraform Init
        if: steps.check_ws.outputs.ws_exists == 'true'
        run: terraform init -input=false

      - name: Generate placeholder tfvars
        if: steps.check_ws.outputs.ws_exists == 'true'
        # Durante el destroy, Terraform lee los valores del state — estos placeholders
        # solo satisfacen la validación de variables requeridas.
        run: |
          {
            echo 'xc_api_p12_file = "./api.p12"'
            echo "xc_api_url      = \"${{ secrets.XC_API_URL }}\""
            echo "f5xc_tenant     = \"${{ secrets.XC_TENANT }}\""
            echo "f5xc_namespace  = \"${{ vars.XC_NAMESPACE }}\""
            echo 'site_name       = "eks-aws-ce-site"'
            echo "app_domain      = \"${{ vars.APP_DOMAIN }}\""
            echo 'kubeconfig      = "placeholder"'
          } > ci.auto.tfvars

      - name: Terraform Destroy
        if: steps.check_ws.outputs.ws_exists == 'true'
        run: terraform destroy -input=false -auto-approve

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f api.p12
          rm -f ci.auto.tfvars

  # ────────────────────────────────────────────────────────────────────────────
  # Stage 1 — Eliminar manifiestos de Hipster Shop de Kubernetes
  # ────────────────────────────────────────────────────────────────────────────
  hipster-shop-destroy:
    name: "Stage 1 · Destroy Hipster Shop en EKS"
    runs-on: ubuntu-latest
    needs: xc-lb-destroy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ vars.AWS_REGION }} \
            --name eks-aws-ce || true

      - name: Eliminar manifiestos de Hipster Shop
        run: kubectl delete -f eks-aws-ce/k8s/hipster-shop.yaml --ignore-not-found=true

      - name: Eliminar RBAC xc-discovery
        run: kubectl delete -f eks-aws-ce/k8s/rbac.yaml --ignore-not-found=true

  # ────────────────────────────────────────────────────────────────────────────
  # Stage 2a — Destruir EKS (paralelo con 2b)
  # ────────────────────────────────────────────────────────────────────────────
  eks-destroy:
    name: "Stage 2a · Destroy EKS cluster"
    runs-on: ubuntu-latest
    needs: hipster-shop-destroy
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ secrets.TFC_ORG }}
      TF_WORKSPACE: eks-aws-ce
    defaults:
      run:
        working-directory: eks-aws-ce/eks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Check if TFC workspace exists
        id: check_ws
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          TFC_ORG:   ${{ secrets.TFC_ORG }}
        run: |
          WS_NAME="eks-aws-ce"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            "https://app.terraform.io/api/v2/organizations/${TFC_ORG}/workspaces/${WS_NAME}")
          if [ "$STATUS" = "200" ]; then
            echo "ws_exists=true" >> "$GITHUB_OUTPUT"
            echo "Workspace '${WS_NAME}' encontrado."
          else
            echo "ws_exists=false" >> "$GITHUB_OUTPUT"
            echo "Workspace '${WS_NAME}' no existe (HTTP $STATUS) — skip destroy."
          fi

      - name: Terraform Init
        if: steps.check_ws.outputs.ws_exists == 'true'
        run: terraform init -input=false

      - name: Terraform Destroy
        if: steps.check_ws.outputs.ws_exists == 'true'
        # Placeholders para list(string): JSON válido requerido por el tipo de variable
        run: terraform destroy -input=false -auto-approve
        env:
          TF_VAR_aws_region:            ${{ vars.AWS_REGION }}
          TF_VAR_vpc_id:                "placeholder"
          TF_VAR_private_subnet_ids:    '["placeholder"]'
          TF_VAR_private_subnet_cidrs:  '["placeholder"]'

  # ────────────────────────────────────────────────────────────────────────────
  # Stage 2b — Destruir Customer Edge F5 XC (paralelo con 2a)
  # ────────────────────────────────────────────────────────────────────────────
  ce-destroy:
    name: "Stage 2b · Destroy F5 XC Customer Edge"
    runs-on: ubuntu-latest
    needs: hipster-shop-destroy
    env:
      VES_P12_PASSWORD: ${{ secrets.XC_P12_PASSWORD }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ secrets.TFC_ORG }}
      TF_WORKSPACE: eks-aws-ce-site
    defaults:
      run:
        working-directory: eks-aws-ce/ce

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Check if TFC workspace exists
        id: check_ws
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          TFC_ORG:   ${{ secrets.TFC_ORG }}
        run: |
          WS_NAME="eks-aws-ce-site"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            "https://app.terraform.io/api/v2/organizations/${TFC_ORG}/workspaces/${WS_NAME}")
          if [ "$STATUS" = "200" ]; then
            echo "ws_exists=true" >> "$GITHUB_OUTPUT"
            echo "Workspace '${WS_NAME}' encontrado."
          else
            echo "ws_exists=false" >> "$GITHUB_OUTPUT"
            echo "Workspace '${WS_NAME}' no existe (HTTP $STATUS) — skip destroy."
          fi

      - name: Write F5 XC API credentials
        if: steps.check_ws.outputs.ws_exists == 'true'
        env:
          XC_API_P12_FILE: ${{ secrets.XC_API_P12_FILE }}
        run: |
          printf '%s' "${XC_API_P12_FILE}" | tr -d '\n\r ' | base64 -d > api.p12
          chmod 600 api.p12

      - name: Terraform Init
        if: steps.check_ws.outputs.ws_exists == 'true'
        run: terraform init -input=false

      - name: Terraform Destroy
        if: steps.check_ws.outputs.ws_exists == 'true'
        run: terraform destroy -input=false -auto-approve
        env:
          TF_VAR_xc_api_p12_file:    "./api.p12"
          TF_VAR_xc_api_url:         ${{ secrets.XC_API_URL }}
          TF_VAR_f5xc_tenant:        ${{ secrets.XC_TENANT }}
          TF_VAR_aws_region:         ${{ vars.AWS_REGION }}
          TF_VAR_aws_access_key:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_key:     ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_vpc_id:             "placeholder"
          TF_VAR_az_names:           '["placeholder"]'
          TF_VAR_outside_subnet_ids: '["placeholder"]'
          TF_VAR_inside_subnet_ids:  '["placeholder"]'
          TF_VAR_ssh_key:            "placeholder"

      - name: Cleanup credentials
        if: always()
        run: rm -f api.p12

  # ────────────────────────────────────────────────────────────────────────────
  # Stage 3 — Destruir VPC (después de que EKS y CE estén destruidos)
  # ────────────────────────────────────────────────────────────────────────────
  vpc-destroy:
    name: "Stage 3 · Destroy VPC + subnets"
    runs-on: ubuntu-latest
    needs: [eks-destroy, ce-destroy]
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ secrets.TFC_ORG }}
      TF_WORKSPACE: eks-aws-ce-vpc
    defaults:
      run:
        working-directory: eks-aws-ce/vpc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Check if TFC workspace exists
        id: check_ws
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          TFC_ORG:   ${{ secrets.TFC_ORG }}
        run: |
          WS_NAME="eks-aws-ce-vpc"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            "https://app.terraform.io/api/v2/organizations/${TFC_ORG}/workspaces/${WS_NAME}")
          if [ "$STATUS" = "200" ]; then
            echo "ws_exists=true" >> "$GITHUB_OUTPUT"
            echo "Workspace '${WS_NAME}' encontrado."
          else
            echo "ws_exists=false" >> "$GITHUB_OUTPUT"
            echo "Workspace '${WS_NAME}' no existe (HTTP $STATUS) — skip destroy."
          fi

      - name: Terraform Init
        if: steps.check_ws.outputs.ws_exists == 'true'
        run: terraform init -input=false

      - name: Terraform Destroy
        if: steps.check_ws.outputs.ws_exists == 'true'
        run: terraform destroy -input=false -auto-approve
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_vpc_cidr:   ${{ vars.VPC_CIDR }}
          TF_VAR_az_names:   ${{ vars.AZ_NAMES }}
