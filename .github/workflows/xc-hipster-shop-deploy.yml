name: XC Hipster Shop – Deploy

on:
  workflow_dispatch:

# ─── Secrets requeridos ───────────────────────────────────────────────────────
#   XC_API_P12_FILE   → cat api-creds.p12 | base64 -w0
#   XC_API_URL        → https://<tenant>.console.ves.volterra.io/api
#   XC_P12_PASSWORD   → contraseña del .p12 en texto plano
#   XC_TENANT         → nombre del tenant F5 XC (ej: my-company)
#   TFC_TOKEN         → token de API de Terraform Cloud
#   TFC_ORG           → nombre de la organización en Terraform Cloud
#
# ─── Variables de repositorio requeridas ──────────────────────────────────────
#   AWS_REGION                  → región AWS donde está el cluster EKS (ej: us-east-1)
#   SITE_NAME_AWS               → nombre del AWS VPC Site en F5 XC (ej: aws-site)
#   XC_NAMESPACE                → namespace F5 XC (ej: default)
#   APP_DOMAIN                  → dominio público (ej: hipster-shop.example.com)
#                                 dejar vacío para usar dominio auto-generado por XC
#   TFC_WORKSPACE_HIPSTER_SHOP  → nombre del workspace TFC para este stack

permissions:
  contents: read

env:
  TF_WORKING_DIR: ./xc-hipster-shop

jobs:
  terraform-deploy:
    name: "Deploy · XC Service Discovery + HTTP Load Balancer"
    runs-on: ubuntu-latest

    env:
      VES_P12_PASSWORD: ${{ secrets.XC_P12_PASSWORD }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ secrets.TFC_ORG }}
      TF_WORKSPACE: ${{ vars.TFC_WORKSPACE_HIPSTER_SHOP }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Write F5 XC API credentials
        env:
          XC_API_P12_FILE: ${{ secrets.XC_API_P12_FILE }}
        run: |
          printf '%s' "${XC_API_P12_FILE}" | tr -d '\n\r ' | base64 -d > api.p12
          chmod 600 api.p12

      - name: Verify P12 password
        run: |
          if openssl pkcs12 -legacy -in api.p12 -passin env:VES_P12_PASSWORD -noout 2>/dev/null || \
             openssl pkcs12 -in api.p12 -passin env:VES_P12_PASSWORD -noout 2>/dev/null; then
            echo "✅ P12 password is correct"
          else
            echo "❌ P12 password is INCORRECT"
            exit 1
          fi

      - name: Create TFC workspace if not exists
        env:
          TFC_TOKEN: ${{ secrets.TFC_TOKEN }}
          TFC_ORG: ${{ secrets.TFC_ORG }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --header "Authorization: Bearer ${TFC_TOKEN}" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/${TFC_ORG}/workspaces/${{ vars.TFC_WORKSPACE_HIPSTER_SHOP }}")

          if [ "$STATUS" = "404" ]; then
            echo "Workspace '${{ vars.TFC_WORKSPACE_HIPSTER_SHOP }}' no existe, creando..."
            curl -s --fail \
              --header "Authorization: Bearer ${TFC_TOKEN}" \
              --header "Content-Type: application/vnd.api+json" \
              --request POST \
              --data '{
                "data": {
                  "type": "workspaces",
                  "attributes": {
                    "name": "${{ vars.TFC_WORKSPACE_HIPSTER_SHOP }}",
                    "execution-mode": "local"
                  }
                }
              }' \
              "https://app.terraform.io/api/v2/organizations/${TFC_ORG}/workspaces"
          else
            echo "Workspace '${{ vars.TFC_WORKSPACE_HIPSTER_SHOP }}' ya existe (HTTP $STATUS)."
          fi

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Obtener nombre del cluster EKS
        id: cluster
        working-directory: eks
        run: |
          terraform init -input=false
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          echo "name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
          TF_CLOUD_ORGANIZATION: ${{ secrets.TFC_ORG }}
          TF_WORKSPACE: eks-cluster

      - name: Generar kubeconfig estático para F5 XC
        id: kubeconfig
        run: |
          # kubectl con exec-auth temporalmente para crear el SA
          aws eks update-kubeconfig \
            --region ${{ vars.AWS_REGION }} \
            --name ${{ steps.cluster.outputs.name }}

          # Crear ServiceAccount + Secret de token estático + RBAC
          kubectl create serviceaccount xc-discovery -n default --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f - << 'MANIFEST'
apiVersion: v1
kind: Secret
metadata:
  name: xc-discovery-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: xc-discovery
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xc-discovery-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xc-discovery-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xc-discovery-reader
subjects:
  - kind: ServiceAccount
    name: xc-discovery
    namespace: default
MANIFEST

          # Esperar a que el token sea populado
          kubectl wait --for=jsonpath='{.data.token}' secret/xc-discovery-token -n default --timeout=30s

          # Extraer token y CA del Secret
          SA_TOKEN=$(kubectl get secret xc-discovery-token -n default \
            -o jsonpath='{.data.token}' | base64 -d)
          CA_DATA=$(kubectl get secret xc-discovery-token -n default \
            -o jsonpath='{.data.ca\.crt}')
          CLUSTER_ENDPOINT=$(aws eks describe-cluster \
            --region ${{ vars.AWS_REGION }} \
            --name ${{ steps.cluster.outputs.name }} \
            --query "cluster.endpoint" --output text)

          # Construir kubeconfig estático con kubectl config (sin heredoc)
          KUBECONFIG=./kubeconfig.yaml kubectl config set-cluster eks-cluster \
            --server="${CLUSTER_ENDPOINT}"
          KUBECONFIG=./kubeconfig.yaml kubectl config set \
            clusters.eks-cluster.certificate-authority-data "${CA_DATA}"
          KUBECONFIG=./kubeconfig.yaml kubectl config set-credentials xc-discovery \
            --token="${SA_TOKEN}"
          KUBECONFIG=./kubeconfig.yaml kubectl config set-context xc-context \
            --cluster=eks-cluster \
            --user=xc-discovery \
            --namespace=default
          KUBECONFIG=./kubeconfig.yaml kubectl config use-context xc-context

      - name: Generate tfvars
        run: |
          cat <<EOF > ci.auto.tfvars
          xc_api_p12_file = "./api.p12"
          xc_api_url      = "${{ secrets.XC_API_URL }}"
          f5xc_tenant     = "${{ secrets.XC_TENANT }}"
          f5xc_namespace  = "${{ vars.XC_NAMESPACE }}"
          site_name       = "${{ vars.SITE_NAME_AWS }}"
          app_domain      = "${{ vars.APP_DOMAIN }}"
          EOF
          printf 'kubeconfig = <<KUBECONFIG\n' >> ci.auto.tfvars
          cat ./kubeconfig.yaml >> ci.auto.tfvars
          printf '\nKUBECONFIG\n' >> ci.auto.tfvars

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform Output
        run: terraform output

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f api.p12
          rm -f ci.auto.tfvars
          rm -f kubeconfig.yaml
