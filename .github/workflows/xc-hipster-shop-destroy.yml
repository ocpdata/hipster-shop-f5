name: XC Hipster Shop – Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe DESTROY para confirmar la eliminación del LB y Service Discovery'
        required: true
        default: ''

permissions:
  contents: read

env:
  TF_WORKING_DIR: ./xc-hipster-shop

jobs:
  terraform-destroy:
    name: "Destroy · XC Service Discovery + HTTP Load Balancer"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'DESTROY' }}

    env:
      VES_P12_PASSWORD: ${{ secrets.XC_P12_PASSWORD }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_CLOUD_ORGANIZATION: ${{ secrets.TFC_ORG }}
      TF_WORKSPACE: ${{ vars.TFC_WORKSPACE_HIPSTER_SHOP }}

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Write F5 XC API credentials
        env:
          XC_API_P12_FILE: ${{ secrets.XC_API_P12_FILE }}
        run: |
          printf '%s' "${XC_API_P12_FILE}" | tr -d '\n\r ' | base64 -d > api.p12
          chmod 600 api.p12

      - name: Terraform Init
        run: terraform init -input=false

      - name: Generate tfvars
        run: |
          cat <<EOF > ci.auto.tfvars
          xc_api_p12_file = "./api.p12"
          xc_api_url      = "${{ secrets.XC_API_URL }}"
          f5xc_tenant     = "${{ secrets.XC_TENANT }}"
          f5xc_namespace  = "${{ vars.XC_NAMESPACE }}"
          site_name       = "${{ vars.SITE_NAME_AWS }}"
          app_domain      = "${{ vars.APP_DOMAIN }}"
          EOF

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f api.p12
          rm -f ci.auto.tfvars
