apiVersion: v1
kind: ServiceAccount
metadata:
  name: xc-discovery
  namespace: default
---
apiVersion: v1
kind: Secret
metadata:
  name: xc-discovery-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: xc-discovery
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xc-discovery-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xc-discovery-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xc-discovery-reader
subjects:
  - kind: ServiceAccount
    name: xc-discovery
    namespace: default
